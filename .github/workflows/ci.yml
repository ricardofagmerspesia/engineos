name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node >= 18 is the runtime; shellcheck covers install.sh and the bash shims
      # that stay until 2.0. jq and python3 are no longer needed anywhere.
      - name: Tools present
        run: |
          shellcheck --version
          bash --version | head -1
          node --version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Node runtime — install, typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Dependency audit
        run: npm audit --audit-level=high

      # Before the tests: the *.e2e.test.ts suites spawn the committed bundle, so a
      # stale dist must fail here with this message, not as an e2e assertion.
      - name: Node runtime — dist drift guard
        run: |
          npm run build
          if ! git diff --quiet -- dist/engineos.cjs; then
            echo "FAIL: dist/engineos.cjs is out of sync with src/ — run npm run build and commit the result."
            git diff --stat -- dist/engineos.cjs
            exit 1
          fi
          echo "ok: dist/engineos.cjs matches src/"
          test "$(node dist/engineos.cjs --version)" = "engineos $(node -p "require('./package.json').version")"

      - name: Node runtime — unit and e2e tests
        run: npm test

      # The gen drift guards below stay on the .sh shims on purpose: they are the
      # one CI exercise the deprecated shims get before 2.0 removes them.
      - name: Shellcheck install.sh + bash shims (errors only)
        run: shellcheck -S error hooks/*.sh install.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for f in hooks/hooks.json .claude-plugin/plugin.json .claude-plugin/marketplace.json templates/mcp.template.json templates/permissions.template.json registries/routing.json registries/decision-rules.json registries/capabilities.json registries/agents.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok $f"
          done

      - name: Agent-commands drift guard
        run: |
          bash scripts/gen-agent-commands.sh
          if ! git diff --quiet -- commands/agents; then
            echo "FAIL: commands/agents/ is out of sync with agents/ — run scripts/gen-agent-commands.sh and commit the result."
            git diff -- commands/agents
            exit 1
          fi
          echo "ok: commands/agents/ matches scripts/gen-agent-commands.sh output"

      - name: Agent-registry drift guard
        run: |
          bash scripts/gen-agent-registry.sh
          if ! git diff --quiet -- registries/agents.json; then
            echo "FAIL: registries/agents.json is out of sync with agents/ — run scripts/gen-agent-registry.sh and commit the result."
            git diff -- registries/agents.json
            exit 1
          fi
          echo "ok: registries/agents.json matches scripts/gen-agent-registry.sh output"

      - name: EngineOS integrity check
        run: node dist/engineos.cjs validate

      - name: Evals (deterministic tier)
        run: node dist/engineos.cjs evals

      - name: Runtime performance budgets
        run: node dist/engineos.cjs bench

      - name: Secrets gate aborts on a planted secret
        run: |
          tmp=$(mktemp -d)
          cp -r . "$tmp/repo"
          # assemble the test token at runtime so this workflow file does not itself
          # match the secrets gate at rest (which would abort every real install)
          prefix='sk-ant-'
          printf '%sapi03-PLANTEDSECRETVALUE1234567890\n' "$prefix" > "$tmp/repo/leak.txt"
          # the gate scans TRACKED files, so the planted secret must be staged
          git -C "$tmp/repo" add leak.txt
          if HOME="$tmp/home" bash "$tmp/repo/install.sh" >/dev/null 2>&1; then
            echo "FAIL: secrets gate did not abort on a planted key"; exit 1
          fi
          echo "ok: gate aborted as expected"

      - name: Secrets gate passes on a clean tree
        run: |
          tmp=$(mktemp -d)
          if HOME="$tmp/home" bash install.sh >/dev/null 2>&1; then
            echo "ok: clean install succeeded"
          else
            echo "FAIL: install aborted on a clean repo"; exit 1
          fi

  # E03 — o console nao era tocado pela CI: typecheck, lint, testes e build
  # rodavam so na maquina de quem editasse. Um console que publica e reverte
  # arquivos do repositorio e faz commit e' superficie de escrita, e superficie
  # de escrita sem verificacao automatizada e' onde perda de trabalho nasce.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes das guardas de publicacao (revisao base e lock de escrita)
        run: npm test

      - name: Build
        run: npm run build

  # E02 — o artefato publicado e testado com os bytes finais da release,
  # em Linux e em Windows/Git Bash. Um pacote que instala so na maquina de
  # quem empacotou nao e distribuicao reproduzivel.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Fim de linha — working tree bate com o HEAD normalizado
        run: |
          # Sem .gitattributes cobrindo todo texto, um checkout Windows
          # reescreve centenas de arquivos para CRLF e o diff vira ruido.
          if ! git diff --quiet; then
            echo "FALHA: checkout diverge do HEAD (provavel CRLF nao normalizado)"
            git diff --stat | tail -20
            exit 1
          fi
          echo "ok: checkout limpo em ${{ matrix.os }}"

      - name: Gerar artefato de release
        run: bash scripts/package-release.sh --out dist-release

      - name: Extrair e validar os bytes finais
        run: |
          ZIP="$(ls dist-release/*.zip)"
          ( cd dist-release && sha256sum -c "$(basename "$ZIP").sha256" )
          mkdir -p /tmp/release-smoke
          unzip -q "$ZIP" -d /tmp/release-smoke
          DIR="$(ls -d /tmp/release-smoke/*/)"
          cd "$DIR"
          bash scripts/validate-engineos.sh
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Rerun idempotente do empacotamento
        run: |
          BEFORE="$(sha256sum dist-release/*.zip | cut -d' ' -f1)"
          bash scripts/package-release.sh --out dist-release
          AFTER="$(sha256sum dist-release/*.zip | cut -d' ' -f1)"
          echo "antes=$BEFORE depois=$AFTER"
          # zip carrega timestamps; o manifesto de conteudo e o invariante.
          echo "ok: rerun concluiu sem erro"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: engineos-release
          path: |
            dist-release/*.zip
            dist-release/*.sha256
            dist-release/*.MANIFEST.txt
