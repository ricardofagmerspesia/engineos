name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      approve_tests:
        description: "Approve final tests, behavioral evals, benchmarks and smoke checks for this run"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Each ref keeps at most one live run. Only pull_request runs are cancelled on a
# new push: a superseded PR run tells us nothing, while a push to main is the
# record of what that commit did and must always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      # node >= 18 is the runtime; shellcheck covers install.sh and the bash shims
      # that stay until 2.0. jq and python3 are no longer needed anywhere.
      # Runs after setup-node so the version printed is the one the jobs use.
      - name: Tools present
        run: |
          shellcheck --version
          bash --version | head -1
          node --version

      - name: Node runtime — install, typecheck
        run: |
          npm ci
          npm run typecheck

      # Advisories stay visible on the PR but do not block it: a new upstream CVE
      # would otherwise redden unrelated work, and the fix never lives in that PR.
      # The blocking cadence is push-to-main here plus dependency-audit.yml weekly.
      - name: Dependency audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --audit-level=high

      # Build and source drift are non-test integration validation. The build
      # writes two loaders (dist/engineos.cjs, dist/engineos-hot.cjs) and their
      # bundles under dist/runtime/, so the guard covers the whole directory and
      # uses `git status --porcelain`: `git diff` is blind to an output file the
      # commit forgot to add, which is exactly how a new bundle goes missing.
      - name: Node runtime — dist drift guard
        run: |
          npm run build
          DRIFT="$(git status --porcelain -- dist/)"
          if [ -n "$DRIFT" ]; then
            echo "FAIL: dist/ is out of sync with src/ — run npm run build and commit the result, new files included."
            printf '%s\n' "$DRIFT"
            git diff --stat -- dist/
            exit 1
          fi
          echo "ok: dist/ matches src/"

      # The gen drift guards below stay on the .sh shims on purpose: they are the
      # one CI exercise the deprecated shims get before 2.0 removes them.
      - name: Shellcheck install.sh + bash shims (errors only)
        run: shellcheck -S error hooks/*.sh install.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for f in hooks/hooks.json .claude-plugin/plugin.json .claude-plugin/marketplace.json templates/mcp.template.json templates/permissions.template.json registries/routing.json registries/decision-rules.json registries/capabilities.json registries/agents.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok $f"
          done

      - name: Agent-commands drift guard
        run: |
          bash scripts/gen-agent-commands.sh
          if ! git diff --quiet -- commands/agents; then
            echo "FAIL: commands/agents/ is out of sync with agents/ — run scripts/gen-agent-commands.sh and commit the result."
            git diff -- commands/agents
            exit 1
          fi
          echo "ok: commands/agents/ matches scripts/gen-agent-commands.sh output"

      - name: Agent-registry drift guard
        run: |
          bash scripts/gen-agent-registry.sh
          if ! git diff --quiet -- registries/agents.json; then
            echo "FAIL: registries/agents.json is out of sync with agents/ — run scripts/gen-agent-registry.sh and commit the result."
            git diff -- registries/agents.json
            exit 1
          fi
          echo "ok: registries/agents.json matches scripts/gen-agent-registry.sh output"

  # Source and console integration validation run concurrently on every event.
  console:
    runs-on: ubuntu-latest
    # Next builds are the slowest step here; 15 minutes is well above the observed
    # runtime and still far below the six-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # better-sqlite3 >= 13 requires node >= 22 (engines)
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Tests are a final stage with explicit human approval for this workflow run.
  # Push and pull_request events validate integration without authorizing tests.
  final-tests:
    needs: [verify, console]
    if: github.event_name == 'workflow_dispatch' && inputs.approve_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The bash-parity suite skips itself on a machine whose bash cannot parse
      # the pinned kernel. Here, that skip would be the only parity evidence
      # quietly disappearing, so this makes it fail instead — see the
      # skipOrFail helper in src/kernel/parity.test.ts.
      ENGINEOS_REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Node runtime — unit and e2e tests
        run: npm test

      - name: EngineOS integrity and behavioral kernel checks
        run: node dist/engineos.cjs validate

      # Both entry points answer --version: the per-call hooks in hooks.json run
      # dist/engineos-hot.cjs, so a hot bundle that fails to load would silence
      # git-write-guard and the edit-time route while the full bundle still passes.
      - name: Bundle version smoke check
        run: |
          EXPECTED="engineos $(node -p "require('./package.json').version")"
          test "$(node dist/engineos.cjs --version)" = "$EXPECTED"
          test "$(node dist/engineos-hot.cjs --version)" = "$EXPECTED"

      - name: Evals (deterministic tier)
        run: node dist/engineos.cjs evals

      - name: Runtime performance budgets
        run: node dist/engineos.cjs bench

      - name: Secrets gate aborts on a planted secret
        run: |
          tmp=$(mktemp -d)
          cp -r . "$tmp/repo"
          # assemble the test token at runtime so this workflow file does not itself
          # match the secrets gate at rest (which would abort every real install)
          prefix='sk-ant-'
          printf '%sapi03-PLANTEDSECRETVALUE1234567890\n' "$prefix" > "$tmp/repo/leak.txt"
          # the gate scans TRACKED files, so the planted secret must be staged
          git -C "$tmp/repo" add leak.txt
          if HOME="$tmp/home" bash "$tmp/repo/install.sh" >/dev/null 2>&1; then
            echo "FAIL: secrets gate did not abort on a planted key"; exit 1
          fi
          echo "ok: gate aborted as expected"

      - name: Secrets gate passes on a clean tree
        run: |
          tmp=$(mktemp -d)
          if HOME="$tmp/home" bash install.sh >/dev/null 2>&1; then
            echo "ok: clean install succeeded"
          else
            echo "FAIL: install aborted on a clean repo"; exit 1
          fi

  console-tests:
    needs: [verify, console]
    if: github.event_name == 'workflow_dispatch' && inputs.approve_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Publish guard tests (base revision and write lock)
        run: npm test

  # E02 — the published artifact is tested with the final bytes of the release,
  # on Linux and on Windows/Git Bash. A package that installs only on the
  # machine of whoever packaged it is not reproducible distribution.
  package:
    # Packaging includes installer and runtime smoke tests, so the whole job
    # belongs to the approved final stage after all integration validation.
    needs: [verify, console]
    if: github.event_name == 'workflow_dispatch' && inputs.approve_tests == true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: End of line - working tree matches the normalized HEAD
        run: |
          # Without .gitattributes covering all text, a Windows checkout
          # rewrites hundreds of files to CRLF and the diff becomes noise.
          if ! git diff --quiet; then
            echo "FAIL: checkout diverges from HEAD (CRLF probably not normalized)"
            git diff --stat | tail -20
            exit 1
          fi
          echo "ok: clean checkout on ${{ matrix.os }}"

      - name: Generate the release artifact
        run: bash scripts/package-release.sh --out dist-release

      - name: Extract and validate the final bytes
        run: |
          ZIP="$(ls dist-release/*.zip)"
          ( cd dist-release && sha256sum -c "$(basename "$ZIP").sha256" )
          rm -rf /tmp/release-smoke
          mkdir -p /tmp/release-smoke
          unzip -q "$ZIP" -d /tmp/release-smoke
          DIR="$(ls -d /tmp/release-smoke/*/)"
          cd "$DIR"
          bash scripts/validate-engineos.sh
          npm ci --no-audit --no-fund
          npm run typecheck

          # `npm test` used to run here and asserted the absence of files nobody
          # publishes: the suites read test/fixtures/legacy-*, .engineos/archived/**
          # and .git, none of which are in the allowlist. What a consumer needs
          # proven is that the shipped bundle RUNS, so assert that instead.
          EXPECTED="engineos $(node -p "require('./package.json').version")"
          ACTUAL="$(node dist/engineos.cjs --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: bundle reports '$ACTUAL', package.json says '$EXPECTED'"
            exit 1
          fi
          echo "ok: bundle reports $ACTUAL"

          node dist/engineos.cjs validate
          echo "ok: registries validate from inside the artifact"

          # One kernel answer end to end: the shim resolves the bundle, the bundle
          # reads the packaged registries, and the route comes back as JSON.
          ROUTE="$(bash scripts/kernel.sh route-path src/orders/orders.service.ts)"
          printf '%s' "$ROUTE" | node -e '
            const answer = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!answer.domain) { console.error("FAIL: kernel answer carries no domain"); process.exit(1); }
            console.log("ok: kernel routed to " + answer.domain);
          '

          # The install path a zip consumer actually takes, against a throwaway
          # HOME so the runner's own ~/.claude is never touched. install.sh needs
          # no flags: it prompts for nothing and reads its target from $HOME.
          # This runs AFTER npm ci on purpose — node_modules present is the state
          # that used to abort the installer's secret scan on false positives.
          SCRATCH_HOME="$(mktemp -d)"
          HOME="$SCRATCH_HOME" bash install.sh
          if ! grep -q 'engineos.cjs' "$SCRATCH_HOME/.claude/settings.json"; then
            echo "FAIL: install.sh registered no EngineOS hooks in $SCRATCH_HOME/.claude/settings.json"
            exit 1
          fi
          echo "ok: install.sh registered the EngineOS hooks from the artifact"

      - name: Idempotent packaging rerun
        run: |
          # The zip embeds mtimes, so its hash is never stable across runs and
          # echoing it proved nothing. The content manifest is the invariant:
          # same commit in, same file set and same hashes out. Only the
          # generated-at line is allowed to move.
          BEFORE="$(ls dist-release/*.MANIFEST.txt)"
          cp "$BEFORE" /tmp/manifest-before.txt
          bash scripts/package-release.sh --out dist-release
          AFTER="$(ls dist-release/*.MANIFEST.txt)"
          if ! diff -u <(grep -v '^# generated:' /tmp/manifest-before.txt) \
                       <(grep -v '^# generated:' "$AFTER"); then
            echo "FAIL: packaging is not idempotent — the content manifest moved between runs"
            exit 1
          fi
          echo "ok: content manifest identical across runs"

      # The Windows leg is the only place a real PowerShell exists, so it is the
      # only place install.ps1 can be linted. Without this the installer's Windows
      # half ships unverified while its Linux half is exercised above.
      - name: Lint install.ps1 with PSScriptAnalyzer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Pinned like every action in this file: PSGallery versions are immutable,
          # so the pin is a real control, and -Force only skips the trust prompt.
          $required = '1.25.0'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq $required)) {
            Install-Module PSScriptAnalyzer -RequiredVersion $required -Repository PSGallery -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $required
          # Excluded rules are deliberate for a user-facing installer: Write-Host IS
          # its output channel, New-Link is not a cmdlet a caller would -WhatIf, and
          # the empty catch blocks guard best-effort probes. Everything else fails.
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning -EnableExit `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingEmptyCatchBlock

      # A lint that never runs the script would have missed the secret-scan abort
      # that install.sh hit. -ClaudeDir exists because PowerShell's $HOME is
      # read-only, so a scratch profile cannot be faked through the environment.
      - name: Run install.ps1 against a scratch directory
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $scratch = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid())
          pwsh -NoProfile -File ./install.ps1 -ClaudeDir $scratch
          $settings = Join-Path $scratch 'settings.json'
          if (-not (Test-Path $settings)) {
            Write-Error "FAIL: install.ps1 wrote no settings.json in $scratch"
            exit 1
          }
          if (-not ((Get-Content $settings -Raw) -match 'engineos\.cjs')) {
            Write-Error "FAIL: install.ps1 registered no EngineOS hooks in $settings"
            exit 1
          }
          Write-Host "ok: install.ps1 registered the EngineOS hooks in $scratch"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: engineos-release
          # The artifact is a CI convenience; the durable copy is the GitHub
          # Release that release.yml creates from the tag.
          retention-days: 30
          path: |
            dist-release/*.zip
            dist-release/*.sha256
            dist-release/*.MANIFEST.txt
