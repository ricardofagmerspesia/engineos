name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools present
        run: |
          jq --version
          shellcheck --version
          bash --version | head -1
          node --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Node runtime — install, typecheck
        run: |
          npm ci
          npm run typecheck

      # Before the tests: the *.e2e.test.ts suites spawn the committed bundle, so a
      # stale dist must fail here with this message, not as an e2e assertion.
      - name: Node runtime — dist drift guard
        run: |
          npm run build
          if ! git diff --quiet -- dist/engineos.cjs; then
            echo "FAIL: dist/engineos.cjs is out of sync with src/ — run npm run build and commit the result."
            git diff --stat -- dist/engineos.cjs
            exit 1
          fi
          echo "ok: dist/engineos.cjs matches src/"
          test "$(node dist/engineos.cjs --version)" = "engineos $(node -p "require('./package.json').version")"

      - name: Node runtime — unit and e2e tests
        run: npm test

      - name: Shellcheck hooks + scripts (errors only)
        run: shellcheck -S error hooks/*.sh install.sh scripts/*.sh

      - name: Validate JSON
        run: |
          for f in hooks/hooks.json .claude-plugin/plugin.json .claude-plugin/marketplace.json templates/mcp.template.json templates/permissions.template.json registries/routing.json registries/decision-rules.json registries/capabilities.json registries/agents.json; do
            jq empty "$f" && echo "ok $f"
          done

      - name: Agent-commands drift guard
        run: |
          bash scripts/gen-agent-commands.sh
          if ! git diff --quiet -- commands/agents; then
            echo "FAIL: commands/agents/ is out of sync with agents/ — run scripts/gen-agent-commands.sh and commit the result."
            git diff -- commands/agents
            exit 1
          fi
          echo "ok: commands/agents/ matches scripts/gen-agent-commands.sh output"

      - name: Agent-registry drift guard
        run: |
          bash scripts/gen-agent-registry.sh
          if ! git diff --quiet -- registries/agents.json; then
            echo "FAIL: registries/agents.json is out of sync with agents/ — run scripts/gen-agent-registry.sh and commit the result."
            git diff -- registries/agents.json
            exit 1
          fi
          echo "ok: registries/agents.json matches scripts/gen-agent-registry.sh output"

      - name: EngineOS integrity check
        run: bash scripts/validate-engineos.sh

      - name: Evals (deterministic tier)
        run: bash scripts/run-evals.sh

      - name: Runtime performance budgets
        run: bash scripts/bench-runtime.sh

      - name: Secrets gate aborts on a planted secret
        run: |
          tmp=$(mktemp -d)
          cp -r . "$tmp/repo"
          # assemble the test token at runtime so this workflow file does not itself
          # match the secrets gate at rest (which would abort every real install)
          prefix='sk-ant-'
          printf '%sapi03-PLANTEDSECRETVALUE1234567890\n' "$prefix" > "$tmp/repo/leak.txt"
          # the gate scans TRACKED files, so the planted secret must be staged
          git -C "$tmp/repo" add leak.txt
          if HOME="$tmp/home" bash "$tmp/repo/install.sh" >/dev/null 2>&1; then
            echo "FAIL: secrets gate did not abort on a planted key"; exit 1
          fi
          echo "ok: gate aborted as expected"

      - name: Secrets gate passes on a clean tree
        run: |
          tmp=$(mktemp -d)
          if HOME="$tmp/home" bash install.sh >/dev/null 2>&1; then
            echo "ok: clean install succeeded"
          else
            echo "FAIL: install aborted on a clean repo"; exit 1
          fi
