name: live-evals

# Live behavioral evals require explicit approval for this manual run, after
# source and console integration validation. They spend real model tokens and
# remain an observability signal rather than a merge gate (evals/RUBRIC.md).
on:
  workflow_dispatch:
    inputs:
      approve_checks:
        description: "Approve final lint/typecheck/build/integrity checks for this integrated ref and run"
        type: boolean
        required: true
        default: false
      approve_tests:
        description: "Approve final live behavioral evals and model token spend for this run"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Source integration validation
        run: |
          npm ci
          npm run typecheck
          npm run build
          git diff --exit-code -- dist/engineos.cjs

  console:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_checks == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Console integration validation
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  live-eval:
    needs: [verify, console]
    if: github.event_name == 'workflow_dispatch' && inputs.approve_checks == true && inputs.approve_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: EngineOS integrity and behavioral kernel checks
        run: node dist/engineos.cjs validate

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Live eval tier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "SKIP: no ANTHROPIC_API_KEY secret configured for this repo — add one to enable this workflow."
            exit 0
          fi
          ENGINEOS_EVAL_LIVE=1 bash scripts/run-evals.sh

      - name: Summary
        if: always()
        run: |
          echo "This workflow is observability, not a merge gate — a red run here" >> "$GITHUB_STEP_SUMMARY"
          echo "means router accuracy drifted, not that a PR is blocked. Compare" >> "$GITHUB_STEP_SUMMARY"
          echo "against evals/RUBRIC.md and consider a skills/retro pass if the" >> "$GITHUB_STEP_SUMMARY"
          echo "same case keeps failing." >> "$GITHUB_STEP_SUMMARY"
