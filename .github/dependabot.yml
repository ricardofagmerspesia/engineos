version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one PR per week: individually they are
      # noise, together they are a single review with a single CI run.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # console/ has its own lockfile and was previously receiving no updates at all.
  - package-ecosystem: npm
    directory: "/console"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint-config-next pulls eslint-plugin-react, whose latest release
      # (7.37.x) still calls context.getFilename, removed in ESLint 10. Lint
      # crashes with "contextOrFilename.getFilename is not a function" until the
      # plugin ships ESLint 10 support. Drop this ignore once it does.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
